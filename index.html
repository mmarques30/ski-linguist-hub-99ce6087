<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!--
      Lien public déjà envoyé : https://plateforme.fli.fr/register
      doit ouvrir https://www.fli.fr/register (Paula, 14/10/2026).
      Exécuté avant React. /register/payment-success et payment-cancel restent ici.
    -->
    <script>
      (function () {
        if (location.hostname !== "plateforme.fli.fr") return;
        var path = location.pathname.replace(/\/+$/, "") || "/";
        if (path !== "/register") return;
        location.replace("https://www.fli.fr/register" + location.search + location.hash);
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FLI - France Langues International</title>
    <meta name="description" content="Formez-vous dans la langue de votre métier, sans sacrifier votre saison. Formations linguistiques sur mesure pour moniteur·rices de ski et professionnels de la montagne — France Langues International.">
    <meta name="author" content="France Langues International" />
    <link rel="canonical" href="https://www.fli.fr/" />
    <!--
      Search Console : propriété domaine fli.fr déjà vérifiée en DNS
      (TXT google-site-verification=0ioKo7qd…). Pour une propriété préfixe URL
      (méthode balise HTML), renseigner VITE_GOOGLE_SITE_VERIFICATION.
    -->
    <meta name="google-site-verification" content="%VITE_GOOGLE_SITE_VERIFICATION%" />

    <!-- Consent Mode v2 : refus analytique par défaut, avant tout script Google. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag("consent", "default", {
        ad_storage: "denied",
        ad_user_data: "denied",
        ad_personalization: "denied",
        analytics_storage: "denied",
        functionality_storage: "denied",
        personalization_storage: "denied",
        security_storage: "granted",
        wait_for_update: 500
      });
    </script>
